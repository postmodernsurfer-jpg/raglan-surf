<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pismo Beach Surf Cam Ticker</title><style>*{box-sizing:border-box}html,body{margin:0;padding:0;background:transparent;overflow:hidden}body{font-family:"Arial Narrow",Arial,Helvetica,sans-serif}.ticker{width:100%;height:58px;background:rgba(8,27,34,.94);color:#edf5f5;border-top:1px solid rgba(255,255,255,.12);border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;overflow:hidden;white-space:nowrap}.track{display:inline-flex;align-items:center;min-width:max-content;animation:scroll 55s linear infinite}.item{font-size:18px;font-weight:700;letter-spacing:.045em;text-transform:uppercase}.sep{font-size:17px;color:#789398;margin:0 18px}.location{font-weight:900}.dot{width:8px;height:8px;border-radius:50%;background:#e75c55;display:inline-block;box-shadow:0 0 8px rgba(231,92,85,.6);margin-right:7px}.live{display:inline-flex;align-items:center}@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}@media(max-width:900px){.item{font-size:15px}.sep{margin:0 13px}}@media(max-width:600px){.ticker{height:48px}.item{font-size:12px}.sep{font-size:12px;margin:0 9px}}</style></head><body><div class="ticker"><div class="track" id="track"><span class="item location"><span class="live"><i class="dot"></i>PISMO BEACH</span></span><span class="sep">•</span><span class="item">Loading live surf conditions…</span></div></div><script>
const LAT=35.1428,LON=-120.6413,TZ="America/Los_Angeles";
const W="https://api.open-meteo.com/v1/forecast?latitude="+LAT+"&longitude="+LON+"&current=temperature_2m,wind_speed_10m,wind_direction_10m,wind_gusts_10m&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone="+encodeURIComponent(TZ);
const M="https://marine-api.open-meteo.com/v1/marine?latitude="+LAT+"&longitude="+LON+"&current=wave_height,wave_period,swell_wave_height,swell_wave_period,swell_wave_direction,sea_surface_temperature&length_unit=imperial&timezone="+encodeURIComponent(TZ)+"&forecast_days=2";
const T="https://api.tidesandcurrents.noaa.gov/api/prod/datagetter?product=predictions&application=pismo_surf_cam&begin_date=20260928&end_date=20260930&datum=MLLW&station=9412110&time_zone=lst_ldt&units=english&interval=hilo&format=json";
const D=d=>Number.isFinite(d)?["N","NE","E","SE","S","SW","W","NW"][Math.round(d/45)%8]:"--";
const F=s=>new Intl.DateTimeFormat("en-US",{timeZone:TZ,hour:"numeric",minute:"2-digit",hour12:false}).format(new Date(s));
const J=async u=>{let r=await fetch(u,{cache:"no-store"});if(!r.ok)throw Error(r.status);return r.json()};
async function load(){try{let[w,m,t]=await Promise.all([J(W),J(M),J(T)]),c=w.current,o=m.current,p=(t.predictions||[]).map(x=>({...x,ms:new Date(x.t).getTime(),v:+x.v})),now=Date.now(),hi=p.find(x=>x.ms>now&&x.type==="H"),lo=p.find(x=>x.ms>now&&x.type==="L");let a=[["SWELL",Number.isFinite(+o.swell_wave_height)?o.swell_wave_height.toFixed(1)+" ft":"--"," @ ",Number.isFinite(+o.swell_wave_period)?o.swell_wave_period.toFixed(0)+"s ":"--",D(+o.swell_wave_direction)],["WAVE",Number.isFinite(+o.wave_height)?o.wave_height.toFixed(1)+" ft":"--"," @ ",Number.isFinite(+o.wave_period)?o.wave_period.toFixed(0)+"s":""],["SEA",Number.isFinite(+o.sea_surface_temperature)?(o.sea_surface_temperature*9/5+32).toFixed(0)+"°F":"--"],["AIR",Number.isFinite(+c.temperature_2m)?Math.round(c.temperature_2m)+"°F":"--"],["WIND",D(+c.wind_direction_10m)+" "+(Number.isFinite(+c.wind_speed_10m)?Math.round(c.wind_speed_10m)+" mph":"--")],["GUST",Number.isFinite(+c.wind_gusts_10m)?Math.round(c.wind_gusts_10m)+" mph":"--"],["NEXT HIGH",hi?F(hi.t)+" ("+hi.v.toFixed(1)+" ft)":"--"],["NEXT LOW",lo?F(lo.t)+" ("+lo.v.toFixed(1)+" ft)":"--"]];let parts=['<span class="item location"><span class="live"><i class="dot"></i>PISMO BEACH</span></span>'];a.forEach((x,i)=>{parts.push('<span class="sep">•</span><span class="item">'+x.join("")+'</span>')});parts.push('<span class="sep">•</span><span class="item">UPDATED '+new Intl.DateTimeFormat("en-US",{timeZone:TZ,hour:"numeric",minute:"2-digit",hour12:true}).format(new Date())+'</span>');parts.push('<span class="sep">•</span>');let one=parts.join(""),tr=document.getElementById("track");tr.innerHTML=one+one;tr.style.animationDuration=Math.max(38,Math.min(75,tr.scrollWidth/85))+"s"}catch(e){document.getElementById("track").innerHTML='<span class="item location"><span class="live"><i class="dot"></i>PISMO BEACH</span></span><span class="sep">•</span><span class="item">LIVE SURF DATA TEMPORARILY UNAVAILABLE</span>'}}load();setInterval(load,300000);
</script></body></html>
