<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Raglan 12 Hour Surf</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Arial,Helvetica,sans-serif;color:#fff}
.panel{width:100%;height:100%;padding:12px;border-radius:14px;background:rgba(2,18,25,.78);border:1px solid rgba(70,220,240,.55);box-shadow:0 8px 28px rgba(0,0,0,.28);backdrop-filter:blur(4px)}
.header{text-align:center;margin-bottom:10px}
.title{font-size:18px;font-weight:900;letter-spacing:.15em}
.sub{font-size:8px;opacity:.65;letter-spacing:.24em;margin-top:3px}
.rows{height:calc(100% - 46px);display:flex;flex-direction:column;gap:5px}
.row{display:grid;grid-template-columns:30px 52px 1fr 72px;align-items:center;gap:5px;min-height:55px;padding:5px 6px;border-radius:9px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08)}
.face{font-size:24px;text-align:center}
.time{font-size:10px;font-weight:800;opacity:.82}
.wave{font-size:17px;font-weight:900;line-height:1.05}
.meta{font-size:9px;font-weight:700;line-height:1.35;opacity:.9}
.tide{display:flex;justify-content:center;align-items:flex-end;height:36px}
.glass{position:relative;width:22px;height:30px;border:2px solid rgba(255,255,255,.75);border-top:0;border-radius:0 0 5px 5px;overflow:hidden}
.water{position:absolute;left:0;right:0;bottom:0;background:#12a8ff;height:50%}
.water:before{content:"";position:absolute;left:-8px;right:-8px;top:-2px;height:6px;background:rgba(255,255,255,.35);border-radius:50%}
.tideText{font-size:7px;opacity:.7;text-align:center;margin-top:2px}
.loading{text-align:center;opacity:.65;font-size:11px;padding-top:20px}
.error{text-align:center;opacity:.75;font-size:10px;padding:15px}
@media(max-width:320px){.title{font-size:15px}.row{grid-template-columns:26px 45px 1fr 58px}.face{font-size:21px}.wave{font-size:15px}.meta{font-size:8px}}
</style>
</head>
<body>
<div class="panel">
  <div class="header">
    <div class="title">RAGLAN, NZ</div>
    <div class="sub">12 HOUR SURF FORECAST</div>
  </div>
  <div id="rows" class="rows"><div class="loading">Loading live surf forecast…</div></div>
</div>
<script>
const LAT=-37.8016,LON=174.8711,TZ="Pacific/Auckland";
const MARINE="https://marine-api.open-meteo.com/v1/forecast?latitude="+LAT+"&longitude="+LON+"&timezone="+encodeURIComponent(TZ)+"&forecast_days=2&hourly=wave_height,wave_period,wave_direction,wind_wave_height,wind_wave_period,wind_wave_direction,swell_wave_height,swell_wave_period,swell_wave_direction,sea_level_height_msl";
const WIND="https://api.open-meteo.com/v1/forecast?latitude="+LAT+"&longitude="+LON+"&timezone="+encodeURIComponent(TZ)+"&forecast_days=2&hourly=wind_speed_10m,wind_direction_10m,temperature_2m";

function dir(deg){if(deg==null)return "--";return ["N","NE","E","SE","S","SW","W","NW"][Math.round(deg/45)%8]}
function face(score){return score>=7?"😍":score>=4?"🙂":"🤯"}
function tidePct(v,min,max){if(v==null||max<=min)return 50;return Math.max(8,Math.min(100,Math.round((v-min)/(max-min)*100)))}
function score(wave,period,wind){
  let s=0;
  if(wave>=1.2)s+=3; else if(wave>=0.7)s+=2; else s+=1;
  if(period>=12)s+=3; else if(period>=10)s+=2; else if(period>=8)s+=1;
  if(wind<=12)s+=2; else if(wind<=20)s+=1; else s-=2;
  return s;
}
function fmt(n,d=1){return Number.isFinite(n)?n.toFixed(d):"--"}
function hourLabel(iso){const d=new Date(iso);return new Intl.DateTimeFormat("en-NZ",{timeZone:TZ,hour:"numeric",hour12:true}).format(d)}

async function load(){
  try{
    const [m,w]=await Promise.all([
      fetch(MARINE,{cache:"no-store"}).then(r=>r.json()),
      fetch(WIND,{cache:"no-store"}).then(r=>r.json())
    ]);
    if(!m.hourly||!w.hourly)throw new Error("missing forecast");

    const now=new Date();
    let start=0;
    for(let i=0;i<m.hourly.time.length;i++){if(new Date(m.hourly.time[i])>=now){start=i;break}}
    const end=Math.min(start+12,m.hourly.time.length);

    const tideVals=m.hourly.sea_level_height_msl.slice(start,end).filter(v=>v!=null);
    const tmin=Math.min(...tideVals), tmax=Math.max(...tideVals);

    const html=[];
    for(let i=start;i<end;i++){
      const waveM=m.hourly.wave_height[i];
      const period=m.hourly.wave_period[i];
      const wind=w.hourly.wind_speed_10m[i];
      const windDir=w.hourly.wind_direction_10m[i];
      const waveFt=waveM==null?null:waveM*3.28084+5;
      const s=score(waveM||0,period||0,wind||99);
      const tide=m.hourly.sea_level_height_msl[i];
      const pct=tidePct(tide,tmin,tmax);
      html.push(
        '<div class="row">'+
        '<div class="face">'+face(s)+'</div>'+
        '<div class="time">'+hourLabel(m.hourly.time[i])+'</div>'+
        '<div><div class="wave">🌊 '+(waveFt==null?"--":Math.round(waveFt))+' FT</div>'+
        '<div class="meta">'+(period==null?"--":Math.round(period))+'s · 💨 '+(wind==null?"--":Math.round(wind))+' km/h '+dir(windDir)+'</div></div>'+
        '<div class="tide"><div><div class="glass"><div class="water" style="height:'+pct+'%"></div></div><div class="tideText">TIDE</div></div></div>'+
        '</div>'
      );
    }
    document.getElementById("rows").innerHTML=html.join("");
  }catch(e){
    document.getElementById("rows").innerHTML='<div class="error">Live surf forecast temporarily unavailable</div>';
  }
}
load();
setInterval(load,300000);
</script>
</body>
</html>
