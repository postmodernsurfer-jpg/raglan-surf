<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Raglan 12 Hour Surf</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important;font-family:Arial,Helvetica,sans-serif;color:#fff}
.panel{width:100%;height:100%;padding:8px;border-radius:10px;background:rgba(2,18,25,.82);border:1px solid rgba(70,220,240,.55);box-shadow:0 5px 18px rgba(0,0,0,.25)}
.header{text-align:center;margin-bottom:6px}.title{font-size:16px;font-weight:900;letter-spacing:.12em}.sub{font-size:7px;opacity:.7;letter-spacing:.18em;margin-top:2px}
.rows{height:calc(100% - 38px);display:flex;flex-direction:column;gap:3px}
.row{display:grid;grid-template-columns:28px 48px minmax(0,1fr) 38px;align-items:center;gap:4px;min-height:0;flex:1;padding:3px 5px;border-radius:7px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08)}
.face{font-size:22px;text-align:center;line-height:1}.time{font-size:9px;font-weight:800;opacity:.85;white-space:nowrap}.wave{font-size:14px;font-weight:900;line-height:1.05;white-space:nowrap}.meta{font-size:8px;font-weight:700;line-height:1.25;opacity:.9;white-space:nowrap}
.tide{display:flex;justify-content:center;align-items:center;height:100%}.glass{position:relative;width:20px;height:27px;border:2px solid rgba(255,255,255,.8);border-top:0;border-radius:0 0 5px 5px;overflow:hidden}.water{position:absolute;left:0;right:0;bottom:0;background:#12a8ff}.water:before{content:"";position:absolute;left:-8px;right:-8px;top:-2px;height:5px;background:rgba(255,255,255,.35);border-radius:50%}.tideText{font-size:6px;opacity:.7;text-align:center;margin-top:1px}
.loading,.error{text-align:center;opacity:.7;font-size:10px;padding-top:20px}
</style>
</head>
<body>
<div class="panel">
<div class="header"><div class="title">RAGLAN, NZ</div><div class="sub">12 HOUR SURF FORECAST</div></div>
<div id="rows" class="rows"><div class="loading">Loading forecast...</div></div>
</div>
<script>
function timeLabel(x){
 const s=String(x);
 const hh=s.slice(11,13);
 const mm=s.slice(14,16);
 if(!hh || !mm)return "--";
 let h=Number(hh); const ap=h>=12?"PM":"AM"; h=h%12||12;
 return h+":"+mm+" "+ap;
}
async function load(){
 try{
  const r=await fetch("./forecast.json?"+Date.now(),{cache:"no-store"});
  if(!r.ok)throw new Error("data");
  const d=await r.json();
  let out="";
  for(const x of d.rows){
   out+='<div class="row"><div class="face">'+x.face+'</div><div class="time">'+timeLabel(x.time)+'</div><div><div class="wave">WAVE '+(x.wave_ft??"--")+' FT</div><div class="meta">'+(x.period??"--")+'s · WIND '+(x.wind_kmh??"--")+' km/h '+(x.wind_dir??"--")+'</div></div><div class="tide"><div><div class="glass"><div class="water" style="height:'+x.tide_pct+'%"></div></div><div class="tideText">TIDE</div></div></div></div>';
  }
  document.getElementById("rows").innerHTML=out||'<div class="error">No forecast data</div>';
 }catch(e){document.getElementById("rows").innerHTML='<div class="error">LIVE FORECAST UNAVAILABLE<br><small>Forecast data is updating</small></div>'}
}
load();setInterval(load,300000);
</script>
</body>
</html>
