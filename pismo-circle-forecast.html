<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Pismo Beach 7-Day Circular Forecast</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;font-family:Arial,Helvetica,sans-serif;color:white}body{display:grid;place-items:center}.dial{position:relative;width:min(94vw,94vh,340px);aspect-ratio:1;border-radius:50%;background:rgba(8,24,38,.78);border:2px solid rgba(255,255,255,.8);box-shadow:0 3px 18px rgba(0,0,0,.3);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:30px 20px;isolation:isolate}.dial:before{content:'';position:absolute;inset:8px;border:1px solid rgba(255,255,255,.22);border-radius:50%;pointer-events:none}.place{font-size:12px;font-weight:800;letter-spacing:2px}.day{font-size:16px;font-weight:800;margin-top:7px}.date{font-size:11px;color:#d6e7ef;margin-top:2px}.weather{font-size:49px;line-height:1.1;margin:4px 0 0}.temp{font-size:38px;font-weight:800;line-height:1.05}.low{font-size:14px;color:#d9e7ef}.condition{font-size:13px;font-weight:700;margin-top:5px}.meta{font-size:11px;margin-top:5px;line-height:1.5}.status{position:absolute;bottom:24px;font-size:9px;color:#c8dce8}.progress{position:absolute;inset:-2px;width:calc(100% + 4px);height:calc(100% + 4px);transform:rotate(-90deg);pointer-events:none}.progress circle{fill:none;stroke:#79d9fa;stroke-width:4;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;animation:tick 5s linear infinite}@keyframes tick{from{stroke-dashoffset:0}to{stroke-dashoffset:-100}}.content{transition:opacity .22s ease}.content.fade{opacity:.1}@media(prefers-reduced-motion:reduce){.content{transition:none}.progress circle{animation:none}}
</style></head><body><section class="dial" aria-label="Rotating Pismo Beach seven-day weather forecast"><svg class="progress" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="49" pathLength="100"/></svg><div class="content" id="content" aria-live="off"><div class="place">PISMO BEACH</div><div class="day" id="day">TODAY</div><div class="date" id="date">Loading forecast</div><div class="weather" id="icon">☀️</div><div class="temp" id="high">--°F</div><div class="low" id="low">LOW --°F</div><div class="condition" id="condition">Connecting…</div><div class="meta" id="meta">WIND -- MPH<br>RAIN --%</div></div><div class="status" id="status">7-DAY FORECAST · UPDATES HOURLY</div></section>
<script>
(()=>{'use strict';const TZ='America/Los_Angeles',LAT=35.1428,LON=-120.6413;const $=id=>document.getElementById(id);let days=[],index=0,rotation=null;const codes={0:['Clear','☀️'],1:['Mostly clear','🌤️'],2:['Partly cloudy','⛅'],3:['Overcast','☁️'],45:['Fog','🌫️'],48:['Fog','🌫️'],51:['Light drizzle','🌦️'],53:['Drizzle','🌦️'],55:['Heavy drizzle','🌧️'],56:['Freezing drizzle','🌧️'],57:['Freezing drizzle','🌧️'],61:['Light rain','🌦️'],63:['Rain','🌧️'],65:['Heavy rain','🌧️'],66:['Freezing rain','🌧️'],67:['Freezing rain','🌧️'],71:['Light snow','🌨️'],73:['Snow','🌨️'],75:['Heavy snow','❄️'],77:['Snow grains','🌨️'],80:['Rain showers','🌦️'],81:['Rain showers','🌧️'],82:['Heavy showers','🌧️'],85:['Snow showers','🌨️'],86:['Snow showers','🌨️'],95:['Thunderstorms','⛈️'],96:['Thunderstorms','⛈️'],99:['Thunderstorms','⛈️']};const n=v=>Number.isFinite(Number(v))?Math.round(Number(v)):'--';function localToday(){return new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}function label(iso){return new Intl.DateTimeFormat('en-US',{weekday:'short',month:'short',day:'numeric',timeZone:'UTC'}).format(new Date(iso+'T12:00:00Z'))}function render(){if(!days.length)return;const d=days[index];$('day').textContent=index===0?'TODAY':index===1?'TOMORROW':new Intl.DateTimeFormat('en-US',{weekday:'long',timeZone:'UTC'}).format(new Date(d.date+'T12:00:00Z')).toUpperCase();$('date').textContent=label(d.date);$('icon').textContent=(codes[d.code]||['Forecast','🌤️'])[1];$('high').textContent=n(d.high)+'°F';$('low').textContent='LOW '+n(d.low)+'°F';$('condition').textContent=(codes[d.code]||['Forecast'])[0];$('meta').innerHTML='WIND '+n(d.wind)+' MPH<br>RAIN '+n(d.rain)+'%'}function next(){if(!days.length)return;$('content').classList.add('fade');setTimeout(()=>{index=(index+1)%days.length;render();$('content').classList.remove('fade')},220)}function start(){clearInterval(rotation);rotation=setInterval(next,5000)}async function load(){try{const url='https://api.open-meteo.com/v1/forecast?latitude='+LAT+'&longitude='+LON+'&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,wind_speed_10m_max&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=America%2FLos_Angeles&forecast_days=8';const res=await fetch(url,{cache:'no-store'});if(!res.ok)throw Error();const j=await res.json(),d=j.daily,today=localToday(),offset=d.time.indexOf(today);if(offset<0)throw Error();days=d.time.slice(offset,offset+7).map((date,k)=>{const i=offset+k;return{date,code:d.weather_code[i],high:d.temperature_2m_max[i],low:d.temperature_2m_min[i],rain:d.precipitation_probability_max[i],wind:d.wind_speed_10m_max[i]}});index=0;render();start();$('status').textContent='7-DAY FORECAST · UPDATES HOURLY'}catch(e){$('status').textContent=days.length?'UPDATE DELAYED · RETRYING':'FORECAST UNAVAILABLE · RETRYING'}}load();setInterval(load,3600000);})();
</script></body></html>
