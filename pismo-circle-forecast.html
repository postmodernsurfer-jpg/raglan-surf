<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pismo Beach 7-Day Forecast</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;color:#fff}body{background:#081824}.panel{width:100%;height:100%;min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px 24px;position:relative}.top{letter-spacing:3px;font-size:13px;font-weight:800;color:#fff}.day{font-size:28px;font-weight:800;margin-top:8px}.date{font-size:14px;color:#bcd0da;margin-top:3px}.weather{font-size:72px;line-height:1;margin:14px 0 4px}.temp{font-size:58px;font-weight:800;line-height:1}.low{font-size:17px;color:#cbdbe2;margin-top:3px}.condition{font-size:18px;font-weight:700;margin-top:10px}.meta{font-size:15px;line-height:1.7;margin-top:7px;color:#dce7eb}.status{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:10px;letter-spacing:.4px;color:#9eb5c0}.bar{position:absolute;top:0;left:0;right:0;height:5px;background:#79d9fa;transform-origin:left;animation:five 5s linear infinite}@keyframes five{from{transform:scaleX(0)}to{transform:scaleX(1)}}.content{transition:opacity .22s ease}.content.fade{opacity:.05}@media(prefers-reduced-motion:reduce){.content{transition:none}.bar{animation:none}}
</style></head><body><section class="panel" aria-label="Rotating Pismo Beach seven-day weather forecast"><div class="bar"></div><div class="content" id="content" aria-live="off"><div class="top">PISMO BEACH</div><div class="day" id="day">TODAY</div><div class="date" id="date">Loading forecast</div><div class="weather" id="icon">☀️</div><div class="temp" id="high">--°F</div><div class="low" id="low">LOW --°F</div><div class="condition" id="condition">Connecting…</div><div class="meta" id="meta">WIND -- MPH<br>RAIN --%</div></div><div class="status" id="status">7-DAY FORECAST · UPDATES HOURLY</div></section>
<script>
(()=>{'use strict';const TZ='America/Los_Angeles',LAT=35.1428,LON=-120.6413,$=id=>document.getElementById(id);let days=[],index=0,rotation;const codes={0:['Clear','☀️'],1:['Mostly clear','🌤️'],2:['Partly cloudy','⛅'],3:['Overcast','☁️'],45:['Fog','🌫️'],48:['Fog','🌫️'],51:['Light drizzle','🌦️'],53:['Drizzle','🌦️'],55:['Heavy drizzle','🌧️'],56:['Freezing drizzle','🌧️'],57:['Freezing drizzle','🌧️'],61:['Light rain','🌦️'],63:['Rain','🌧️'],65:['Heavy rain','🌧️'],66:['Freezing rain','🌧️'],67:['Freezing rain','🌧️'],71:['Light snow','🌨️'],73:['Snow','🌨️'],75:['Heavy snow','❄️'],77:['Snow grains','🌨️'],80:['Rain showers','🌦️'],81:['Rain showers','🌧️'],82:['Heavy showers','🌧️'],85:['Snow showers','🌨️'],86:['Snow showers','🌨️'],95:['Thunderstorms','⛈️'],96:['Thunderstorms','⛈️'],99:['Thunderstorms','⛈️']};const n=v=>Number.isFinite(Number(v))?Math.round(Number(v)):'--';function today(){return new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}function dateLabel(x){return new Intl.DateTimeFormat('en-US',{weekday:'short',month:'short',day:'numeric',timeZone:'UTC'}).format(new Date(x+'T12:00:00Z'))}function render(){if(!days.length)return;const d=days[index],name=new Intl.DateTimeFormat('en-US',{weekday:'long',timeZone:'UTC'}).format(new Date(d.date+'T12:00:00Z'));$('day').textContent=index===0?'TODAY':index===1?'TOMORROW':name.toUpperCase();$('date').textContent=dateLabel(d.date);$('icon').textContent=(codes[d.code]||['Forecast','🌤️'])[1];$('high').textContent=n(d.high)+'°F';$('low').textContent='LOW '+n(d.low)+'°F';$('condition').textContent=(codes[d.code]||['Forecast'])[0];$('meta').innerHTML='WIND '+n(d.wind)+' MPH<br>RAIN '+n(d.rain)+'%'}function next(){if(!days.length)return;$('content').classList.add('fade');setTimeout(()=>{index=(index+1)%days.length;render();$('content').classList.remove('fade')},220)}function start(){clearInterval(rotation);rotation=setInterval(next,5000)}async function load(){try{const u='https://api.open-meteo.com/v1/forecast?latitude='+LAT+'&longitude='+LON+'&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,wind_speed_10m_max&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=America%2FLos_Angeles&forecast_days=8';const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error();const j=await r.json(),d=j.daily,o=d.time.indexOf(today());if(o<0)throw Error();days=d.time.slice(o,o+7).map((date,k)=>{const i=o+k;return{date,code:d.weather_code[i],high:d.temperature_2m_max[i],low:d.temperature_2m_min[i],rain:d.precipitation_probability_max[i],wind:d.wind_speed_10m_max[i]}});index=0;render();start();$('status').textContent='7-DAY FORECAST · UPDATES HOURLY'}catch(e){$('status').textContent=days.length?'UPDATE DELAYED · RETRYING':'FORECAST UNAVAILABLE · RETRYING'}}load();setInterval(load,3600000)})();
</script></body></html>
