name: Update Surf News

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch latest surf and ocean news
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python - <<'PY'
          import json, re, urllib.parse, urllib.request, xml.etree.ElementTree as ET
          from datetime import datetime, timezone
          from email.utils import parsedate_to_datetime

          queries = [
            'surfing OR surf forecast OR surfboard OR swell',
            '"El Niño" OR ENSO OR ocean warming OR marine heatwave',
            '"big swell" OR "huge swell" OR "historic swell" OR "record swell"',
            'Pipeline OR Teahupo\'o OR Mavericks OR Cloudbreak OR Jaws OR Nazaré OR Jeffreys Bay OR Bells Beach OR Trestles OR Rincon OR Puerto Escondido',
            'WSL OR professional surfing OR surf competition'
          ]

          stories=[]
          seen=set()

          for q in queries:
              try:
                  query = urllib.parse.quote(q)
                  url = f'https://news.google.com/rss/search?q={query}&hl=en-US&gl=US&ceid=US:en'
                  req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0'})
                  data = urllib.request.urlopen(req, timeout=30).read()
                  root = ET.fromstring(data)

                  for item in root.findall('./channel/item'):
                      title=(item.findtext('title') or '').strip()
                      link=(item.findtext('link') or '').strip()
                      pub=(item.findtext('pubDate') or '').strip()
                      desc=re.sub(r'<[^>]+>',' ',item.findtext('description') or '')
                      desc=re.sub(r'\\s+',' ',desc).strip()

                      if not title or not link:
                          continue

                      clean_title=title.rsplit(' - ',1)[0].strip() if ' - ' in title else title
                      key=clean_title.lower()
                      if key in seen:
                          continue
                      seen.add(key)

                      source_el=item.find('{http://search.yahoo.com/mrss/}source')
                      source=(source_el.text if source_el is not None else 'SURF NEWS') or 'SURF NEWS'

                      try:
                          dt=parsedate_to_datetime(pub).astimezone(timezone.utc)
                          date=dt.strftime('%b %d, %Y').upper()
                      except Exception:
                          date=''

                      text_blob=(clean_title+' '+desc).lower()
                      if any(x in text_blob for x in ['el niño','enso','ocean','marine heat','kelvin wave']):
                          category='OCEAN & WEATHER'
                      elif any(x in text_blob for x in ['pipeline','teahupo','mavericks','cloudbreak','nazare','jaws','jeffreys','bells','trestles','rincon','puerto escondido']):
                          category='FAMOUS SURF SPOTS'
                      elif any(x in text_blob for x in ['swell','wave','storm','hurricane']):
                          category='SWELL & WAVES'
                      else:
                          category='SURF NEWS'

                      stories.append({
                        'source':source.upper(),
                        'title':clean_title,
                        'summary':desc[:280],
                        'date':date,
                        'url':link,
                        'category':category
                      })
              except Exception:
                  pass

          stories=stories[:80]
          out={'updated':datetime.now(timezone.utc).isoformat(),'stories':stories}
          with open('surf-news.json','w',encoding='utf-8') as f:
              json.dump(out,f,ensure_ascii=False,indent=2)
          PY

      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add surf-news.json
          git diff --cached --quiet || git commit -m "Update surf and ocean news feed"
          git push
