name: Update Raglan Surf Forecast

on:
  push:
    paths:
      - ".github/workflows/update-surf-forecast.yml"
      - "scripts/update_forecast.py"
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch and build forecast
        run: python scripts/update_forecast.py

      - name: Commit forecast data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forecast.json
          git diff --cached --quiet || git commit -m "Update Raglan surf forecast"
          git push
