<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raglan Weather Widget</title>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Arial,Helvetica,sans-serif}
  .widget{display:inline-block;color:#fff;background:rgba(0,0,0,.55);padding:12px 16px;border-radius:8px;
    text-shadow:0 1px 3px #000;line-height:1.15;min-width:260px;box-sizing:border-box}
  .title{font-size:18px;font-weight:700;letter-spacing:.08em;margin-bottom:7px}
  .main{display:flex;align-items:center;gap:10px}
  .icon{font-size:30px}.temp{font-size:29px;font-weight:700}.condition{font-size:15px}
  .details{margin-top:7px;font-size:14px;display:flex;gap:14px;flex-wrap:wrap}
  .updated{margin-top:7px;font-size:10px;opacity:.75}
  .error{font-size:13px}
</style>
</head>
<body>
<div class="widget" id="widget">
  <div class="title">RAGLAN, NEW ZEALAND</div>
  <div class="main">
    <div class="icon" id="icon">•</div>
    <div><div class="temp" id="temp">--°C</div><div class="condition" id="condition">Loading weather…</div></div>
  </div>
  <div class="details">
    <span>💨 <b id="wind">--</b></span>
    <span>💧 <b id="humidity">--%</b></span>
  </div>
  <div class="updated" id="updated"></div>
</div>
<script>
const LAT=-37.8016, LON=174.8711;
const labels={0:["☀️","Clear"],1:["🌤️","Mainly clear"],2:["⛅","Partly cloudy"],3:["☁️","Overcast"],
45:["🌫️","Fog"],48:["🌫️","Rime fog"],51:["🌦️","Light drizzle"],53:["🌦️","Drizzle"],55:["🌧️","Heavy drizzle"],
61:["🌦️","Light rain"],63:["🌧️","Rain"],65:["🌧️","Heavy rain"],71:["🌨️","Light snow"],73:["🌨️","Snow"],75:["❄️","Heavy snow"],
80:["🌦️","Rain showers"],81:["🌧️","Rain showers"],82:["⛈️","Heavy showers"],95:["⛈️","Thunderstorm"],96:["⛈️","Thunderstorm"],99:["⛈️","Thunderstorm"]};
function dir(deg){const a=["N","NE","E","SE","S","SW","W","NW"];return a[Math.round(deg/45)%8]}
async function load(){
 try{
  const u=`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m,wind_direction_10m&timezone=Pacific%2FAuckland`;
  const d=await (await fetch(u,{cache:"no-store"})).json(), c=d.current, x=labels[c.weather_code]||["•","Weather"];
  icon.textContent=x[0]; temp.textContent=Math.round(c.temperature_2m)+"°C"; condition.textContent=x[1];
  wind.textContent=dir(c.wind_direction_10m)+" "+Math.round(c.wind_speed_10m)+" km/h";
  humidity.textContent=Math.round(c.relative_humidity_2m)+"%";
  updated.textContent="Updated "+new Date().toLocaleTimeString("en-NZ",{hour:"numeric",minute:"2-digit"});
 }catch(e){condition.textContent="Weather unavailable";updated.textContent="Retrying…"}
}
load(); setInterval(load,300000);
</script>
</body>
</html>
