<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Surf Trivia Q&A</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Arial,Helvetica,sans-serif;color:#fff}
body{display:flex;align-items:flex-end;justify-content:center;padding:14px}
.card{width:100%;max-width:1150px;min-height:106px;padding:15px 24px 14px;border-radius:10px;background:rgba(4,19,28,.93);border:1px solid rgba(121,217,250,.35);box-shadow:0 4px 18px rgba(0,0,0,.28);position:relative;overflow:hidden}
.header{display:flex;align-items:center;gap:9px;font-size:11px;font-weight:900;letter-spacing:2.2px;color:#79d9fa}.dot{width:7px;height:7px;border-radius:50%;background:#79d9fa;box-shadow:0 0 8px #79d9fa}
.category{position:absolute;right:24px;top:14px;font-size:10px;font-weight:900;letter-spacing:1.4px;color:#a8c2cb;text-transform:uppercase}
.label{font-size:9px;font-weight:900;letter-spacing:1.5px;color:#79d9fa;margin-top:8px}.text{font-size:19px;line-height:1.28;font-weight:700;margin-top:3px;max-width:1050px}.source{font-size:8px;color:#849ca5;margin-top:6px}
.content{transition:opacity .25s ease,transform .25s ease}.out{opacity:0;transform:translateY(5px)}
.progress{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.08)}.progress i{display:block;height:100%;width:0;background:#79d9fa}
@media(max-width:650px){body{padding:7px}.card{padding:11px 15px}.text{font-size:15px}.category{display:none}}
</style></head>
<body><section class="card"><div class="content" id="content">
<div class="header"><span class="dot"></span>SURF TRIVIA</div><div class="category" id="category">WHAT</div>
<div class="label" id="label">QUESTION</div><div class="text" id="text">Loading surf trivia…</div><div class="source" id="source"></div>
</div><div class="progress"><i id="progress"></i></div></section>
<script>
(()=>{'use strict';
const F=[
['WHO','Who won the men’s world surfing title in 1999?','Mark Occhilupo of Australia.','SURF HISTORY'],
['WHO','Who won the women’s world surfing title in 1999?','Layne Beachley of Australia.','SURF HISTORY'],
['WHO','Who won the first Olympic men’s surfing gold medal?','Italo Ferreira of Brazil, at Tokyo 2020 in 2021.','OLYMPIC SURFING'],
['WHO','Who won the first Olympic women’s surfing gold medal?','Carissa Moore of Hawaii, at Tokyo 2020 in 2021.','OLYMPIC SURFING'],
['WHO','Who has won the most men’s world surfing titles?','Kelly Slater, with 11 world titles.','SURFERS'],
['WHO','Who is known as the father of modern surfing?','Duke Kahanamoku, the Hawaiian Olympic swimming champion who helped popularize surfing internationally.','SURF HISTORY'],
['WHO','Who directed the classic surf film The Endless Summer?','Bruce Brown.','SURF FILMS'],
['WHO','Who popularized the modern three-fin thruster surfboard design?','Australian surfer Simon Anderson.','SURFBOARDS'],
['WHO','Who is known as Mr. Pipeline?','Gerry Lopez, because of his close association with Pipeline on Oahu.','HAWAII'],
['WHO','Who won the 2025 men’s world surfing title?','Yago Dora of Brazil.','PRO SURFING'],
['WHO','Who won the 2025 women’s world surfing title?','Molly Picklum of Australia.','PRO SURFING'],
['WHAT','What is the term for the hollow tube formed when a wave breaks over a surfer?','A barrel, also called a tube.','SURF TERMS'],
['WHAT','What is the term for turning back toward the breaking part of a wave?','A cutback.','SURF TERMS'],
['WHAT','What is the term for the turn made near the bottom of a wave before driving up the face?','A bottom turn.','SURF TERMS'],
['WHAT','What is a closeout?','A wave that breaks across most or all of its face at once, leaving little open shoulder.','SURF TERMS'],
['WHAT','What is a duck dive?','A maneuver used by a shortboard surfer to push the board underwater and pass beneath an approaching wave.','SURF TERMS'],
['WHAT','What is a thruster?','A surfboard with three fins, a setup that became one of the dominant designs in modern surfing.','SURFBOARDS'],
['WHAT','What does swell period mean?','The time between successive wave crests.','OCEAN SCIENCE'],
['WHAT','What makes a long-period swell different from a short-period wind swell?','Long-period swell generally carries more energy, travels faster in deep water and can produce powerful surf when it reaches a suitable coastline.','OCEAN SCIENCE'],
['WHAT','What is El Niño?','A phase of the ENSO climate cycle marked by unusually warm sea-surface temperatures in the central and eastern tropical Pacific, along with atmospheric changes.','OCEAN & WEATHER'],
['WHAT','What is La Niña?','The cooler phase of ENSO, associated with cooler-than-average central and eastern tropical Pacific waters.','OCEAN & WEATHER'],
['WHAT','What is a super swell?','A very large, powerful swell generated by a strong and/or long-lived weather system, often producing exceptional surf at exposed breaks.','OCEAN SCIENCE'],
['WHERE','Where is Pipeline?','On Oahu’s North Shore in Hawaii.','HAWAII'],
['WHERE','Where is Teahupo’o?','On the southwest coast of Tahiti in French Polynesia.','TAHITI'],
['WHERE','Where is Mavericks?','Near Half Moon Bay on the Northern California coast.','CALIFORNIA'],
['WHERE','Where is Cloudbreak?','Off Tavarua Island in Fiji.','FIJI'],
['WHERE','Where is Jaws?','At Peahi on the north shore of Maui, Hawaii.','HAWAII'],
['WHERE','Where is Nazaré, the famous giant-wave break?','On Portugal’s Atlantic coast.','PORTUGAL'],
['WHERE','Where is Jeffreys Bay?','On South Africa’s Eastern Cape coast.','SOUTH AFRICA'],
['WHERE','Where is Bells Beach?','Near Torquay in Victoria, Australia.','AUSTRALIA'],
['WHERE','Where is Lower Trestles?','Near San Clemente in Southern California.','CALIFORNIA'],
['WHERE','Where is Rincon?','On the California coast between Santa Barbara and Ventura.','CALIFORNIA'],
['WHERE','Where is Puerto Escondido’s famous Zicatela Beach?','On Mexico’s Pacific coast in Oaxaca.','MEXICO'],
['WHERE','Where is Mundaka?','In the Basque Country of northern Spain.','EUROPE'],
['WHERE','Where is Uluwatu?','On the Bukit Peninsula of Bali, Indonesia.','INDONESIA'],
['WHERE','Where is Padang Padang?','On Bali’s southwest coast in Indonesia.','INDONESIA'],
['WHERE','Where is Snapper Rocks?','On Australia’s Gold Coast in Queensland.','AUSTRALIA'],
['WHERE','Where is Kirra?','On Australia’s Gold Coast in Queensland.','AUSTRALIA'],
['WHERE','Where is Manu Bay?','At Raglan on New Zealand’s North Island.','NEW ZEALAND'],
['WHERE','Where is Steamer Lane?','At Lighthouse Point in Santa Cruz, California.','CALIFORNIA'],
['WHERE','Where is Waimea Bay?','On Oahu’s North Shore in Hawaii.','HAWAII'],
['WHEN','When did professional surfing’s modern world championship tour begin?','The professional world tour began in 1976, when the organization was known as the IPS.','SURF HISTORY'],
['WHEN','When was the first Olympic surfing competition held?','At Tokyo 2020, with surfing competition taking place in 2021.','OLYMPIC SURFING'],
['WHEN','When did Kelly Slater win his first world title?','1992.','SURFERS'],
['WHEN','When did John John Florence win his first men’s world title?','2016.','SURFERS'],
['WHEN','When was The Endless Summer released?','1964.','SURF FILMS'],
['WHEN','When did Mark Richards win his first world title?','1979.','SURFERS'],
['WHY','Why can El Niño produce bigger or more frequent surf along parts of California?','El Niño can shift Pacific storm tracks and increase the opportunity for Southern Hemisphere and tropical-generated swells to reach California. The exact surf outcome varies by event and location.','OCEAN & WEATHER'],
['WHY','Why is California being watched closely for the 2026–27 winter?','A strengthening El Niño is expected to coincide with elevated ocean temperatures, storms, high tides and potentially large waves, increasing the potential for major surf and coastal hazards.','OCEAN & WEATHER'],
['WHY','Why can a deep ocean canyon make Nazaré waves so large?','The canyon can focus and refract incoming swell energy toward the coastline, helping produce exceptionally large waves.','OCEAN SCIENCE'],
['WHY','Why does a wave get steeper as it reaches shallow water?','The lower part of the wave interacts with the seafloor, slowing the wave and causing its energy to compress into a shorter, steeper shape.','OCEAN SCIENCE'],
['WHY','Why are winter swells so important at many California surf spots?','Winter storms in the North Pacific can generate long-period northwest swells that travel thousands of miles toward the California coast.','CALIFORNIA'],
['WHY','Why is Pipeline so hollow?','Its shallow reef and steep underwater bathymetry force incoming swell to pitch rapidly over the reef, creating hollow barrels.','HAWAII'],
['WHY','Why is Cloudbreak famous for big swells?','Its exposed position in the South Pacific allows powerful long-period swells to reach the reef with relatively little obstruction.','FIJI'],
['WHY','Why is Teahupo’o so thick-looking?','The wave breaks over an unusually shallow reef while the deep ocean immediately offshore allows powerful swell energy to arrive at the break.','TAHITI'],
['WHY','Why can a tropical cyclone create surf hundreds or thousands of miles away?','Its strong winds can transfer energy into the ocean and generate long-period swell that travels far beyond the storm itself.','OCEAN SCIENCE']
];

let items=[],idx=-1,live=[];
const $=id=>document.getElementById(id);
function shuffle(a){return a.slice().sort(()=>Math.random()-.5)}
function newsToQA(s){
 const title=(s.title||'').trim(), summary=(s.summary||'').replace(/\s+/g,' ').trim(), b=(title+' '+summary).toLowerCase();
 let cat='WHAT',q='What is the main surf or ocean development in this story?';
 if(/win|champion|title|surfer|athlete/.test(b)){cat='WHO';q='Who is involved in this recent surf story?'}
 else if(/where|beach|coast|california|hawaii|australia|mexico|fiji|tahiti|portugal/.test(b)){cat='WHERE';q='Where is this recent surf or ocean story happening?'}
 else if(/when|today|tomorrow|weekend|winter|forecast|expected|arrive|arriving/.test(b)){cat='WHEN';q='When is this surf or ocean development expected to happen?'}
 else if(/why|because|el niño|el nino|enso|climate|storm|swell/.test(b)){cat='WHY';q='Why is this recent surf or ocean development important?'}
 return {category:cat,question:q,answer:title+(summary?' — '+summary:''),source:''};
}
async function getNews(){
 try{
  const r=await fetch('https://postmodernsurfer-jpg.github.io/raglan-surf/surf-news.json?v='+Date.now(),{cache:'no-store'});const j=await r.json();
  live=(j.stories||[]).map(newsToQA);build();
 }catch(e){if(!items.length)build()}
}
function build(){items=shuffle([...F.map(x=>({category:x[0],question:x[1],answer:x[2],source:x[3]})),...live,...live]);idx=-1;show()}
function show(){
 if(!items.length)return;const f=items[idx=(idx+1)%items.length],c=$('content');c.classList.add('out');
 setTimeout(()=>{$('category').textContent=f.category;$('label').textContent='QUESTION';$('text').textContent=f.question;$('source').textContent='';c.classList.remove('out');bar(5);setTimeout(()=>answer(f),5200)},260)
}
function answer(f){const c=$('content');c.classList.add('out');setTimeout(()=>{$('label').textContent='ANSWER';$('text').textContent=f.answer;$('source').textContent=f.source||'';c.classList.remove('out');bar(9)},260)}
function bar(sec){const p=$('progress');p.style.transition='none';p.style.width='0';void p.offsetWidth;p.style.transition='width '+sec+'s linear';p.style.width='100%'}
getNews();setInterval(show,14300);setInterval(getNews,30*60*1000);
})();
</script></body></html>
